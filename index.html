<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bússola</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction: column;
    gap: 20px;
}

img{
    width:300px;
}

#debug{
    color: #00ff00;
    font-family: monospace;
    font-size: 14px;
}
</style>
</head>

<body>

<img id="bussola" src="./0.png" loading="lazy" decoding="async">
<div id="debug">Aguardando sensor...</div>

<script>

// coloque aqui TODOS os ângulos que possuem imagem
const direcoes = [
    0,13,25,38,50,63,75,88,
    100,113,125,138,150,163,
    175,188,200,213,225,238,
    250,263,275,288,300,313,
    325,338,350
];

// Pré-carregar as imagens em background
const cache = {};
direcoes.forEach(angle => {
    const img = new Image();
    img.src = `./${angle}.png`;
    cache[angle] = img;
});

function imagemMaisProxima(grau){

    let melhor = direcoes[0];
    let menorDiferenca = 360;

    for(const d of direcoes){

        let diff = Math.abs(grau - d);

        // trata a volta de 359° para 0°
        diff = Math.min(diff, 360 - diff);

        if(diff < menorDiferenca){
            menorDiferenca = diff;
            melhor = d;
        }
    }

    return melhor;
}

let ultimaDirecao = null;

window.addEventListener("deviceorientation", (event)=>{

    const grau = event.alpha;

    if(grau == null) return;

    const direcao = imagemMaisProxima(grau);

    // Só atualiza se mudou de direção (evita requisições desnecessárias)
    if(direcao !== ultimaDirecao){
        ultimaDirecao = direcao;
        document.getElementById("bussola").src = cache[direcao].src;
        document.getElementById("debug").textContent = `Grau: ${grau.toFixed(1)}° → Imagem: ${direcao}.png`;
    }

});

// Fallback para dispositivos que não suportam
window.addEventListener("load", ()=>{
    if(typeof DeviceOrientationEvent === 'undefined'){
        document.getElementById("debug").textContent = "❌ Sensor de bússola não suportado";
        document.getElementById("debug").style.color = "#ff0000";
    }
});

</script>

</body>
</html>
