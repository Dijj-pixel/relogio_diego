<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Bússola</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  /* 80% da largura, sempre quadrado, e nunca estourando a altura */
  #bussola {
    width:  min(80vw, 80vh);
    height: min(80vw, 80vh);
    display: block;
    pointer-events: none;
  }
</style>
</head>

<body>

<canvas id="bussola"></canvas>

<script>
(() => {
  'use strict';

  /* ---------------------------------------------------------
     1. CONFIGURAÇÃO
     --------------------------------------------------------- */

  // Ângulos que possuem imagem (o "nome numérico" de cada fatia).
  const DIRECOES = [
    0,13,25,38,50,63,75,88,
    100,113,125,138,150,163,
    175,188,200,213,225,238,
    250,263,275,288,300,313,
    325,338,350
  ];

  // Onde procurar os PNGs. Tenta a raiz, depois ./bussola/.
  const CAMINHOS = ['./', './bussola/'];

  /* ---------------------------------------------------------
     2. ELEMENTOS / ESTADO
     --------------------------------------------------------- */

  const canvas = document.getElementById('bussola');
  const ctx    = canvas.getContext('2d', { alpha: true, desynchronized: true });

  const imagens = new Array(DIRECOES.length).fill(null); // índice -> HTMLImageElement
  const lut     = new Int16Array(360).fill(-1);          // grau (0-359) -> índice
  let ultimo    = -1;                                    // índice atualmente desenhado

  /* ---------------------------------------------------------
     3. CARREGAMENTO (com fallback de pasta + decode)
     --------------------------------------------------------- */

  function carregar(nome) {
    // Tenta cada pasta com um Image NOVO — nunca reaproveita um que já falhou,
    // porque onerror/onload depois de um src que falhou são pouco confiáveis.
    return new Promise(resolve => {
      let i = 0;

      const tentar = () => {
        if (i >= CAMINHOS.length) {
          resolve(null);
          return;
        }

        const img = new Image();
        const src = CAMINHOS[i] + nome;
        i++;

        let resolvido = false;
        const finalizar = (valor) => {
          if (resolvido) return;   // onload E onerror podem disparar juntos em alguns browsers
          resolvido = true;
          resolve(valor);
        };

        img.onload = () => {
          if (img.decode) {
            img.decode().then(() => finalizar(img)).catch(() => finalizar(img));
          } else {
            finalizar(img);
          }
        };

        img.onerror = () => tentar();  // próximo caminho, novo Image
        img.src = src;
      };

      tentar();
    });
  }

  /* ---------------------------------------------------------
     4. CONSTRUÇÃO DA LUT (grau -> índice da imagem)
     --------------------------------------------------------- */

  function construirLUT() {
    const disponiveis = [];
    for (let i = 0; i < imagens.length; i++) {
      if (imagens[i]) disponiveis.push(i);
    }
    if (!disponiveis.length) return;

    // Para cada um dos 360 graus, acha o ângulo mais próximo UMA VEZ.
    // Depois é só lut[grau] — sem loop nenhum durante o movimento.
    for (let g = 0; g < 360; g++) {
      let melhor = disponiveis[0];
      let menor  = 361;

      for (let k = 0; k < disponiveis.length; k++) {
        const idx = disponiveis[k];
        let diff = g - DIRECOES[idx];
        if (diff < 0) diff = -diff;
        if (diff > 180) diff = 360 - diff;

        if (diff < menor) {
          menor  = diff;
          melhor = idx;
        }
      }

      lut[g] = melhor;
    }
  }

  /* ---------------------------------------------------------
     5. DESENHO (troca imediata, sem reflow)
     --------------------------------------------------------- */

  function desenhar(idx) {
    if (idx < 0 || idx === ultimo) return;

    const img = imagens[idx];
    if (!img) return;

    ultimo = idx;

    // Ajusta o backing store do canvas pro tamanho real da imagem (só uma vez).
    if (canvas.width !== img.naturalWidth || canvas.height !== img.naturalHeight) {
      canvas.width  = img.naturalWidth;
      canvas.height = img.naturalHeight;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
  }

  /* ---------------------------------------------------------
     6. SENSOR
     --------------------------------------------------------- */

  let modoAbsoluto = false;
  let ativo        = false;
  let pedindo      = false;

  function aoOrientar(e) {
    // Se já temos um evento absoluto, ignora os relativos (evita "briga").
    if (e.type === 'deviceorientationabsolute' || e.absolute === true) {
      modoAbsoluto = true;
    } else if (modoAbsoluto) {
      return;
    }

    // iOS entrega o rumo direto em webkitCompassHeading.
    let grau = e.webkitCompassHeading;
    if (typeof grau !== 'number' || !isFinite(grau)) grau = e.alpha;
    if (typeof grau !== 'number' || !isFinite(grau)) return;

    grau = ((grau % 360) + 360) % 360;

    const idx = lut[grau | 0];
    if (idx >= 0) desenhar(idx);
  }

  function escutar() {
    window.addEventListener('deviceorientationabsolute', aoOrientar, true);
    window.addEventListener('deviceorientation',         aoOrientar, true);
  }

  function iniciar() {
    if (ativo || pedindo) return;
    if (typeof DeviceOrientationEvent === 'undefined') {
      console.warn('Sensor de orientação não suportado.');
      return;
    }

    // iOS 13+ exige um gesto do usuário.
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      pedindo = true;
      DeviceOrientationEvent.requestPermission()
        .then(r => {
          pedindo = false;
          if (r === 'granted') { ativo = true; escutar(); }
        })
        .catch(() => { pedindo = false; });
    } else {
      ativo = true;
      escutar();
    }
  }

  /* ---------------------------------------------------------
     7. BOOT
     --------------------------------------------------------- */

  (async function boot() {
    // Carrega + decodifica TUDO antes de ligar o sensor.
    await Promise.all(
      DIRECOES.map((ang, i) =>
        carregar(ang + '.png').then(img => {
          imagens[i] = img;
          if (!img) console.warn('Faltando:', ang + '.png');
        })
      )
    );

    const ok = imagens.filter(Boolean).length;
    console.log(`Imagens carregadas: ${ok}/${DIRECOES.length}`);

    construirLUT();

    // Mostra alguma coisa na tela imediatamente.
    for (let i = 0; i < imagens.length; i++) {
      if (imagens[i]) { desenhar(i); break; }
    }

    // Tenta ligar o sensor já; no iOS o primeiro toque resolve.
    iniciar();
    document.addEventListener('click',    iniciar);
    document.addEventListener('touchend', iniciar, { passive: true });

    // Diagnóstico do sensor: rode isto e gire o celular pra ver qual
    // campo varia de 0 a 360. Descomente quando precisar investigar.
    // window.addEventListener('deviceorientation', e => {
    //   console.log('alpha:', e.alpha,
    //               '| compass:', e.webkitCompassHeading,
    //               '| abs:', e.absolute);
    // }, true);
  })();

})();
</script>

</body>
</html>
