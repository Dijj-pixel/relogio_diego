<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Bússola</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  #bussola {
    width:  min(80vw, 80vh);
    height: min(80vw, 80vh);
    display: block;
    pointer-events: none;
  }
</style>
</head>

<body>

<canvas id="bussola"></canvas>

<script>
(() => {
  'use strict';

  /* ---------------------------------------------------------
     1. CONFIGURAÇÃO
     --------------------------------------------------------- */

  const DIRECOES = [
    0,13,25,38,50,63,75,88,
    100,113,125,138,150,163,
    175,188,200,213,225,238,
    250,263,275,288,300,313,
    325,338,350
  ];

  const CAMINHOS = ['./', './bussola/'];

  /* ---------------------------------------------------------
     2. ELEMENTOS / ESTADO
     --------------------------------------------------------- */

  const canvas = document.getElementById('bussola');
  const ctx    = canvas.getContext('2d', { alpha: true, desynchronized: true });

  const imagens = new Array(DIRECOES.length).fill(null);
  const lut     = new Int16Array(360).fill(-1);
  let ultimo    = -1;
  let pronto    = false;   // só aceita sensor depois da LUT montada

  /* ---------------------------------------------------------
     3. CARREGAMENTO
     --------------------------------------------------------- */

  function carregar(nome) {
    return new Promise(resolve => {
      let i = 0;

      const tentar = () => {
        if (i >= CAMINHOS.length) { resolve(null); return; }

        const img = new Image();
        const src = CAMINHOS[i] + nome;
        i++;

        let resolvido = false;
        const finalizar = (valor) => {
          if (resolvido) return;
          resolvido = true;
          resolve(valor);
        };

        img.onload = () => {
          if (img.decode) {
            img.decode().then(() => finalizar(img)).catch(() => finalizar(img));
          } else {
            finalizar(img);
          }
        };

        img.onerror = () => tentar();
        img.src = src;
      };

      tentar();
    });
  }

  /* ---------------------------------------------------------
     4. LUT
     --------------------------------------------------------- */

  function construirLUT() {
    const disponiveis = [];
    for (let i = 0; i < imagens.length; i++) {
      if (imagens[i]) disponiveis.push(i);
    }
    if (!disponiveis.length) return;

    for (let g = 0; g < 360; g++) {
      let melhor = disponiveis[0];
      let menor  = 361;

      for (let k = 0; k < disponiveis.length; k++) {
        const idx = disponiveis[k];
        let diff = g - DIRECOES[idx];
        if (diff < 0) diff = -diff;
        if (diff > 180) diff = 360 - diff;

        if (diff < menor) {
          menor  = diff;
          melhor = idx;
        }
      }

      lut[g] = melhor;
    }
  }

  /* ---------------------------------------------------------
     5. DESENHO
     --------------------------------------------------------- */

  function desenhar(idx) {
    if (idx < 0 || idx === ultimo) return;

    const img = imagens[idx];
    if (!img) return;

    ultimo = idx;

    if (canvas.width !== img.naturalWidth || canvas.height !== img.naturalHeight) {
      canvas.width  = img.naturalWidth;
      canvas.height = img.naturalHeight;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
  }

  /* ---------------------------------------------------------
     6. SENSOR — agora filtra por QUALIDADE, não por ordem
     --------------------------------------------------------- */

  function aoOrientar(e) {
    if (!pronto) return;

    // 1) iOS: rumo magnético direto.
    let grau = e.webkitCompassHeading;
    let fonte = 'webkitCompassHeading';

    // 2) Android/Chrome: só aceita alpha se for ABSOLUTO.
    if (typeof grau !== 'number' || !isFinite(grau)) {
      const ehAbsoluto =
        e.type === 'deviceorientationabsolute' || e.absolute === true;

      if (!ehAbsoluto) return;          // <-- o pulo do gato: ignora relativo

      grau  = e.alpha;
      fonte = 'alpha(absolute)';
    }

    if (typeof grau !== 'number' || !isFinite(grau)) return;

    grau = ((grau % 360) + 360) % 360;

    const idx = lut[grau | 0];
    if (idx >= 0) desenhar(idx);

    // Diagnóstico opcional:
    // console.log(fonte, grau.toFixed(1), '->', DIRECOES[idx]);
  }

  function escutar() {
    window.addEventListener('deviceorientationabsolute', aoOrientar, true);
    window.addEventListener('deviceorientation',         aoOrientar, true);
  }

  let ativo   = false;
  let pedindo = false;

  function iniciar() {
    if (ativo || pedindo) return;
    if (typeof DeviceOrientationEvent === 'undefined') {
      console.warn('Sensor de orientação não suportado.');
      return;
    }

    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      pedindo = true;
      DeviceOrientationEvent.requestPermission()
        .then(r => {
          pedindo = false;
          if (r === 'granted') { ativo = true; escutar(); }
        })
        .catch(() => { pedindo = false; });
    } else {
      ativo = true;
      escutar();
    }
  }

  /* ---------------------------------------------------------
     7. BOOT
     --------------------------------------------------------- */

  (async function boot() {
    await Promise.all(
      DIRECOES.map((ang, i) =>
        carregar(ang + '.png').then(img => {
          imagens[i] = img;
          if (!img) console.warn('Faltando:', ang + '.png');
        })
      )
    );

    const ok = imagens.filter(Boolean).length;
    console.log(`Imagens carregadas: ${ok}/${DIRECOES.length}`);

    construirLUT();
    pronto = true;

    // Desenha a fatia inicial (a mais próxima de 0° que existe).
    const inicial = lut[0];
    if (inicial >= 0) desenhar(inicial);

    iniciar();
    document.addEventListener('click',    iniciar);
    document.addEventListener('touchend', iniciar, { passive: true });
  })();

})();
</script>

</body>
</html>
