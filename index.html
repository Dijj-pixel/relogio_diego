<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bússola</title>

<style>
    :root{ color-scheme: dark; }
    *{ box-sizing: border-box; }

    html, body{ height: 100%; margin: 0; }

    body{
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        touch-action: none;
    }

    /* 80% da largura da tela, sempre quadrada.
       Tire ", 80vh" do min() se quiser 80vw puro mesmo que estoure a altura. */
    #palco{
        position: relative;
        width: min(80vw, 80vh);
        aspect-ratio: 1 / 1;
    }

    #palco img{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
    }

    #loading{
        position: fixed;
        inset: 0;
        background: #000;
        color: #666;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity .25s ease;
        z-index: 10;
        text-align: center;
        padding: 24px;
    }

    #loading.escondido{ opacity: 0; pointer-events: none; }

    #permissao{
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.92);
        color: #eee;
        font-family: system-ui, sans-serif;
        display: none;
        flex-direction: column;
        gap: 16px;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 24px;
        z-index: 20;
    }

    #permissao.visivel{ display: flex; }

    #permissao button{
        background: #fff;
        color: #000;
        border: 0;
        border-radius: 8px;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    #erro{
        position: fixed;
        bottom: 16px;
        left: 0;
        right: 0;
        text-align: center;
        color: #ff4d4d;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        display: none;
        padding: 0 16px;
    }
</style>
</head>

<body>

<div id="palco">
    <img id="bussola" alt="">
</div>

<div id="loading">Procurando sprites…</div>

<div id="permissao">
    <p>Este dispositivo exige sua permissão<br>para usar o sensor de orientação.</p>
    <button id="btnPermissao">Ativar bússola</button>
</div>

<div id="erro"></div>

<script>
(() => {

// ---------------------------------------------------------------
// Configuração
// ---------------------------------------------------------------

// Candidatos de pasta, testados nessa ordem. O primeiro que tiver
// "0.png" respondendo é usado pra varredura completa.
const CANDIDATOS_DE_PASTA = ["./bussola/", "./"];

// Quantos graus, no máximo, o código varre procurando sprites (0-359).
const MAX_ANGULO = 360;

// Quantas tentativas de carregamento ficam em voo ao mesmo tempo
// durante a varredura inicial.
const LOTE_DE_DETECCAO = 24;

// Fator do filtro de suavização aplicado à leitura do sensor
// (0 = ignora leituras novas, 1 = sem suavização nenhuma).
const FATOR_SUAVIZACAO = 0.15;

const cache = {};       // angulo -> Image já carregada e decodificada
let direcoes = [];      // lista ordenada dos ângulos realmente encontrados
let tabelaDePonteiros = null; // grau inteiro (0-359) -> ângulo mais próximo

const bussolaEl = document.getElementById("bussola");
const loadingEl = document.getElementById("loading");
const erroEl = document.getElementById("erro");

// ---------------------------------------------------------------
// Detecção numérica dos sprites + pré-carregamento + decodificação,
// tudo em uma única varredura.
// ---------------------------------------------------------------
function tentarCarregar(basePath, angulo){
    return new Promise(resolve => {
        const img = new Image();
        img.onload = async () => {
            try{ if(img.decode) await img.decode(); }catch(e){}
            resolve(img);
        };
        img.onerror = () => resolve(null);
        img.src = `${basePath}${angulo}.png`;
    });
}

async function escolherPasta(){
    for(const pasta of CANDIDATOS_DE_PASTA){
        const teste = await tentarCarregar(pasta, 0);
        if(teste){
            cache[0] = teste;
            return pasta;
        }
    }
    return null;
}

async function detectarEPreCarregar(basePath){
    const angulosPendentes = [];
    for(let a = 1; a < MAX_ANGULO; a++) angulosPendentes.push(a);

    let concluidos = 1; // o ângulo 0 já foi resolvido em escolherPasta()
    const total = MAX_ANGULO;

    // processa em lotes pra não abrir centenas de conexões simultâneas
    for(let i = 0; i < angulosPendentes.length; i += LOTE_DE_DETECCAO){
        const lote = angulosPendentes.slice(i, i + LOTE_DE_DETECCAO);
        const resultados = await Promise.all(
            lote.map(a => tentarCarregar(basePath, a).then(img => {
                concluidos++;
                loadingEl.textContent = `Procurando sprites… ${concluidos}/${total}`;
                return [a, img];
            }))
        );
        for(const [angulo, img] of resultados){
            if(img) cache[angulo] = img;
        }
    }

    direcoes = Object.keys(cache).map(Number).sort((a, b) => a - b);
}

// ---------------------------------------------------------------
// Tabela de ponteiros: 360 posições, cada uma já resolvida pro
// sprite mais próximo. Leitura em runtime é O(1).
// ---------------------------------------------------------------
function montarTabelaDePonteiros(angulos){
    const tabela = new Array(360);
    for(let grau = 0; grau < 360; grau++){
        let melhor = angulos[0];
        let menorDiferenca = Infinity;
        for(const d of angulos){
            let diff = Math.abs(grau - d);
            diff = Math.min(diff, 360 - diff);
            if(diff < menorDiferenca){
                menorDiferenca = diff;
                melhor = d;
            }
        }
        tabela[grau] = melhor;
    }
    return tabela;
}

// ---------------------------------------------------------------
// CAMADA 1 — leitura do sensor.
// Só grava o valor bruto. Não mexe no DOM, não calcula nada pesado.
// ---------------------------------------------------------------
let anguloBruto = null;

function aoReceberOrientacao(event){
    if(event.alpha == null) return;
    anguloBruto = event.alpha;
}

// ---------------------------------------------------------------
// CAMADA 2 — processamento e renderização, desacoplada da leitura.
// Roda em loop próprio (requestAnimationFrame), suaviza o ângulo
// e avança o "ponteiro" um índice por vez, sem pular sprite.
// ---------------------------------------------------------------
let anguloFiltrado = null;
let indiceAtual = 0;

function diferencaAngular(alvo, atual){
    // menor caminho angular de "atual" até "alvo", no intervalo [-180, 180]
    return ((alvo - atual + 540) % 360) - 180;
}

function proximoIndice(atual, alvo, n){
    if(atual === alvo) return atual;
    const paraFrente = (alvo - atual + n) % n;
    const paraTras = (atual - alvo + n) % n;
    return paraFrente <= paraTras ? (atual + 1) % n : (atual - 1 + n) % n;
}

function loopDeRenderizacao(){
    if(anguloBruto !== null && direcoes.length > 0){

        // suaviza o ruído do sensor (filtro exponencial circular)
        if(anguloFiltrado === null){
            anguloFiltrado = anguloBruto;
        }else{
            anguloFiltrado = (anguloFiltrado
                + diferencaAngular(anguloBruto, anguloFiltrado) * FATOR_SUAVIZACAO
                + 360) % 360;
        }

        const grauInteiro = Math.round(((anguloFiltrado % 360) + 360) % 360);
        const anguloAlvo = tabelaDePonteiros[grauInteiro];
        const indiceAlvo = direcoes.indexOf(anguloAlvo);

        if(indiceAlvo !== indiceAtual){
            // avança só UM passo em direção ao alvo — nunca pula sprite,
            // mesmo que o dispositivo gire rápido entre um frame e outro
            indiceAtual = proximoIndice(indiceAtual, indiceAlvo, direcoes.length);
            const angulo = direcoes[indiceAtual];
            bussolaEl.src = cache[angulo].src;
        }
    }

    requestAnimationFrame(loopDeRenderizacao);
}

// ---------------------------------------------------------------
// Sensor: início + permissão (iOS 13+/Safari exige toque do usuário)
// ---------------------------------------------------------------
function iniciarSensor(){
    window.addEventListener("deviceorientationabsolute", aoReceberOrientacao, true);
    window.addEventListener("deviceorientation", aoReceberOrientacao, true);
}

function precisaDePermissaoExplicita(){
    return typeof DeviceOrientationEvent !== "undefined"
        && typeof DeviceOrientationEvent.requestPermission === "function";
}

async function configurarSensor(){
    if(typeof DeviceOrientationEvent === "undefined"){
        erroEl.textContent = "Sensor de bússola não suportado neste dispositivo";
        erroEl.style.display = "block";
        return;
    }

    if(precisaDePermissaoExplicita()){
        const overlay = document.getElementById("permissao");
        overlay.classList.add("visivel");

        document.getElementById("btnPermissao").addEventListener("click", async () => {
            try{
                const resposta = await DeviceOrientationEvent.requestPermission();
                if(resposta === "granted"){
                    overlay.classList.remove("visivel");
                    iniciarSensor();
                }else{
                    overlay.querySelector("p").textContent = "Permissão negada. Ative nas configurações do navegador.";
                }
            }catch(e){
                overlay.querySelector("p").textContent = "Não foi possível pedir permissão ao sensor.";
            }
        });
        return;
    }

    iniciarSensor();
}

// ---------------------------------------------------------------
// Boot
// ---------------------------------------------------------------
window.addEventListener("load", async () => {
    const pasta = await escolherPasta();

    if(!pasta){
        loadingEl.classList.add("escondido");
        erroEl.textContent = "Nenhum sprite encontrado (verifique se 0.png existe em ./bussola/ ou ./)";
        erroEl.style.display = "block";
        return;
    }

    await detectarEPreCarregar(pasta);

    if(direcoes.length === 0){
        loadingEl.classList.add("escondido");
        erroEl.textContent = "Nenhum sprite pôde ser carregado";
        erroEl.style.display = "block";
        return;
    }

    console.log(`Bússola: ${direcoes.length} sprites detectados em "${pasta}":`, direcoes);

    tabelaDePonteiros = montarTabelaDePonteiros(direcoes);

    indiceAtual = 0;
    bussolaEl.src = cache[direcoes[0]].src;
    loadingEl.classList.add("escondido");

    requestAnimationFrame(loopDeRenderizacao);
    configurarSensor();
});

})();
</script>

</body>
</html>
